[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dokureader"
version = "1.0.1.dev0"
description = "Local-first document library organizer and topic-based PDF manager"
readme = "README.md"
authors = [
    { name = "doc-bricks Team" }
]
license = { text = "AGPL-3.0" }
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "desktop-app",
    "document-management",
    "library",
    "pdf",
    "pdf-export",
    "python",
    "tkinter",
    "document-library",
    "document-preview",
    "file-management",
    "local-first",
    "offline-first",
    "privacy-first",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "PyMuPDF>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/DokuReader"
Documentation = "https://github.com/doc-bricks/DokuReader#readme"
Repository = "https://github.com/doc-bricks/DokuReader.git"
Issues = "https://github.com/doc-bricks/DokuReader/issues"
Changelog = "https://github.com/doc-bricks/DokuReader/blob/master/CHANGELOG.md"
Security = "https://github.com/doc-bricks/DokuReader/blob/master/SECURITY.md"
"Third-Party Licenses" = "https://github.com/doc-bricks/DokuReader/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/doc-bricks/DokuReader/blob/master/MARKETING-LOG.txt"
"LLM Context" = "https://github.com/doc-bricks/DokuReader/blob/master/llms.txt"
"Parent Organization" = "https://github.com/doc-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
