<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Font styling and imports -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      .wordmark {
        font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .tagline {
        font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" x="80" y="60" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.06" />
    </pattern>

    <!-- Blur Filter for Shadows -->
    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <!-- Text/Logo Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Spine 3D Shading Overlay -->
    <linearGradient id="spine-shading" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.25)" />
      <stop offset="40%" stop-color="rgba(0,0,0,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
    </linearGradient>

    <!-- Book Cover Gradients -->
    <!-- Book 1: Coral Red -->
    <linearGradient id="book-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#ee5253" />
    </linearGradient>
    <!-- Book 2: Orange -->
    <linearGradient id="book-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43" />
      <stop offset="100%" stop-color="#f08a24" />
    </linearGradient>
    <!-- Book 3: Gold/Amber -->
    <linearGradient id="book-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f5b041" />
    </linearGradient>
    <!-- Book 4: Emerald Green -->
    <linearGradient id="book-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dd1a1" />
      <stop offset="100%" stop-color="#10ac84" />
    </linearGradient>
    <!-- Book 5: Teal/Sky Blue -->
    <linearGradient id="book-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48dbfb" />
      <stop offset="100%" stop-color="#0abde3" />
    </linearGradient>
    <!-- Book 6: Indigo/Royal Blue -->
    <linearGradient id="book-grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54a0ff" />
      <stop offset="100%" stop-color="#2e86de" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Background Dot Grid (strictly inside Safe Zone x:80..1120 y:60..300) -->
  <rect x="80" y="60" width="1040" height="240" fill="url(#dot-grid)" rx="8" />

  <!-- Shelf Shadow (fuzzy ellipse under the books) -->
  <ellipse cx="337" cy="264" rx="250" ry="7" fill="#000000" fill-opacity="0.4" filter="url(#shadow-blur)" />

  <!-- Shelf Line (strictly inside Safe Zone) -->
  <line x1="80" y1="256" x2="600" y2="256" stroke="#374151" stroke-width="4" stroke-linecap="round" stroke-dasharray="none" />
  <line x1="80" y1="256" x2="600" y2="256" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-dasharray="none" opacity="0.6" />

  <!-- Motion Lines / Action Sparks (under the books in layering) -->
  <!-- Falling path dashed line -->
  <path d="M 100,120 C 105,95 135,100 160,115" stroke="#4b5563" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="4 4" opacity="0.5" />
  
  <!-- Motion Swooshes -->
  <path d="M 75,160 A 70,70 0 0,1 125,100" stroke="#f3f4f6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.15" />
  <path d="M 155,165 A 70,70 0 0,1 200,105" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.1" />

  <!-- ==================== BOOKS GROUP ==================== -->
  <!-- Render order: Book 6, Book 5, Book 4, Book 3, Book 2, Book 1 -->

  <!-- Book 6: Royal Blue (Upright, 0 deg) -->
  <g transform="translate(515, 125)">
    <!-- Pages showing at top/right -->
    <rect x="6" y="3" width="70" height="124" rx="3" fill="#fefdfa"/>
    <line x1="71" y1="8" x2="71" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <line x1="73" y1="8" x2="73" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <!-- Bookmark Ribbon -->
    <path d="M 32,126 L 32,148 L 35,152 L 38,148 L 38,126 Z" fill="#ff9f43" />
    <!-- Front Cover -->
    <rect x="0" y="0" width="72" height="130" rx="5" fill="url(#book-grad-6)" />
    <!-- Spine shading -->
    <rect x="0" y="0" width="14" height="130" rx="3" fill="url(#spine-shading)" />
    <!-- Spine ribs -->
    <path d="M 0,20 L 14,20 M 0,40 L 14,40 M 0,90 L 14,90 M 0,110 L 14,110" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Cover design: Star -->
    <path d="M 43,56 L 46,63 L 53,63 L 48,67 L 50,74 L 43,69 L 36,74 L 38,67 L 33,63 L 40,63 Z" fill="#ffffff" fill-opacity="0.25" />
  </g>

  <!-- Book 5: Teal (Slight tilt, 6 deg) -->
  <g transform="translate(430, 125) rotate(6, 80, 130)">
    <!-- Pages showing at top/right -->
    <rect x="6" y="3" width="70" height="124" rx="3" fill="#fefdfa"/>
    <line x1="71" y1="8" x2="71" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <line x1="73" y1="8" x2="73" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <!-- Bookmark Ribbon -->
    <path d="M 32,126 C 32,133 30,139 28,144 C 26,146 28,148 31,148 C 33,143 36,136 38,126 Z" fill="#ffd32a" />
    <!-- Front Cover -->
    <rect x="0" y="0" width="72" height="130" rx="5" fill="url(#book-grad-5)" />
    <!-- Spine shading -->
    <rect x="0" y="0" width="14" height="130" rx="3" fill="url(#spine-shading)" />
    <!-- Spine ribs -->
    <path d="M 0,20 L 14,20 M 0,40 L 14,40 M 0,90 L 14,90 M 0,110 L 14,110" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Cover design: Geometric arches -->
    <path d="M 33,75 A 10,10 0 0,1 53,75 M 28,75 A 15,15 0 0,1 58,75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25"/>
  </g>

  <!-- Book 4: Emerald Green (Moderate tilt, 18 deg) -->
  <g transform="translate(345, 125) rotate(18, 80, 130)">
    <!-- Pages showing at top/right -->
    <rect x="6" y="3" width="70" height="124" rx="3" fill="#fefdfa"/>
    <line x1="71" y1="8" x2="71" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <line x1="73" y1="8" x2="73" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <!-- Bookmark Ribbon -->
    <path d="M 32,126 C 31,134 28,141 24,147 C 22,149 24,152 27,152 C 31,146 36,137 38,126 Z" fill="#ff6b6b" />
    <!-- Front Cover -->
    <rect x="0" y="0" width="72" height="130" rx="5" fill="url(#book-grad-4)" />
    <!-- Spine shading -->
    <rect x="0" y="0" width="14" height="130" rx="3" fill="url(#spine-shading)" />
    <!-- Spine ribs -->
    <path d="M 0,20 L 14,20 M 0,40 L 14,40 M 0,90 L 14,90 M 0,110 L 14,110" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Cover design: Vertical stripes -->
    <line x1="35" y1="40" x2="35" y2="90" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="43" y1="40" x2="43" y2="90" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="51" y1="40" x2="51" y2="90" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
  </g>

  <!-- Book 3: Gold (Tilted, 30 deg) -->
  <g transform="translate(260, 125) rotate(30, 80, 130)">
    <!-- Pages showing at top/right -->
    <rect x="6" y="3" width="70" height="124" rx="3" fill="#fefdfa"/>
    <line x1="71" y1="8" x2="71" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <line x1="73" y1="8" x2="73" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <!-- Bookmark Ribbon -->
    <path d="M 32,126 C 30,135 24,142 19,149 C 17,151 19,154 22,154 C 27,147 34,138 38,126 Z" fill="#1dd1a1" />
    <!-- Front Cover -->
    <rect x="0" y="0" width="72" height="130" rx="5" fill="url(#book-grad-3)" />
    <!-- Spine shading -->
    <rect x="0" y="0" width="14" height="130" rx="3" fill="url(#spine-shading)" />
    <!-- Spine ribs -->
    <path d="M 0,20 L 14,20 M 0,40 L 14,40 M 0,90 L 14,90 M 0,110 L 14,110" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <!-- Cover design: Diamond -->
    <rect x="35" y="57" width="16" height="16" transform="rotate(45, 43, 65)" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  </g>

  <!-- Book 2: Orange (Pushed, 42 deg) -->
  <g transform="translate(175, 125) rotate(42, 80, 130)">
    <!-- Pages showing at top/right -->
    <rect x="6" y="3" width="70" height="124" rx="3" fill="#fefdfa"/>
    <line x1="71" y1="8" x2="71" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <line x1="73" y1="8" x2="73" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <!-- Bookmark Ribbon -->
    <path d="M 32,126 C 28,136 20,144 14,152 C 12,154 14,157 17,157 C 23,149 32,139 38,126 Z" fill="#48dbfb" />
    <!-- Front Cover -->
    <rect x="0" y="0" width="72" height="130" rx="5" fill="url(#book-grad-2)" />
    <!-- Spine shading -->
    <rect x="0" y="0" width="14" height="130" rx="3" fill="url(#spine-shading)" />
    <!-- Spine ribs -->
    <path d="M 0,20 L 14,20 M 0,40 L 14,40 M 0,90 L 14,90 M 0,110 L 14,110" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <!-- Cover design: Diagonal stripes -->
    <line x1="25" y1="45" x2="60" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.25"/>
    <line x1="33" y1="37" x2="68" y2="72" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.25"/>
  </g>

  <!-- Book 1: Coral Red (Falling, 54 deg) -->
  <g transform="translate(90, 125) rotate(54, 80, 130)">
    <!-- Pages showing at top/right -->
    <rect x="6" y="3" width="70" height="124" rx="3" fill="#fefdfa"/>
    <line x1="71" y1="8" x2="71" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <line x1="73" y1="8" x2="73" y2="122" stroke="#eadaa6" stroke-dasharray="1 2"/>
    <!-- Bookmark Ribbon -->
    <path d="M 32,126 C 26,138 15,145 8,154 C 6,156 8,159 11,159 C 18,152 28,142 38,126 Z" fill="#ffd32a" />
    <!-- Front Cover -->
    <rect x="0" y="0" width="72" height="130" rx="5" fill="url(#book-grad-1)" />
    <!-- Spine shading -->
    <rect x="0" y="0" width="14" height="130" rx="3" fill="url(#spine-shading)" />
    <!-- Spine ribs -->
    <path d="M 0,20 L 14,20 M 0,40 L 14,40 M 0,90 L 14,90 M 0,110 L 14,110" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <!-- Cover design: Circle with dot -->
    <circle cx="43" cy="65" r="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
    <circle cx="43" cy="65" r="4" fill="#ffffff" fill-opacity="0.3"/>
  </g>

  <!-- Collision / Sparkle Effects (Strictly inside Safe Zone) -->
  <!-- Impact 1 Sparkle (between Book 1 and Book 2) -->
  <g transform="translate(236, 162)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 3" opacity="0.3"/>
    <path d="M 0,-6 L 1,-2 L 5,0 L 1,2 L 0,6 L -1,2 L -5,0 L -1,-2 Z" fill="#ffd32a"/>
  </g>
  
  <!-- Impact 2 Sparkle (between Book 2 and Book 3) -->
  <g transform="translate(324, 182)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 3" opacity="0.2"/>
    <path d="M 0,-5 L 1,-1.5 L 4,0 L 1,1.5 L 0,5 L -1,1.5 L -4,0 L -1,-1.5 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Playful background stars/sparkles in safe zone -->
  <!-- Sparkle near top-left of books -->
  <g transform="translate(100, 85)" opacity="0.7">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#48dbfb"/>
  </g>
  <!-- Sparkle near middle top -->
  <g transform="translate(565, 80)" opacity="0.8">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#ffd32a"/>
  </g>

  <!-- ==================== TYPOGRAPHY / LOGO ==================== -->
  <!-- Wordmark + Tagline (Centered vertically in Safe Zone x:650..1120 y:60..300) -->
  <g>
    <!-- Accent Sparkle near logo -->
    <g transform="translate(1075, 135)" opacity="0.9">
      <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#ffd32a"/>
    </g>

    <!-- Main Wordmark -->
    <text x="650" y="185" class="wordmark" font-size="76" font-weight="800" letter-spacing="-1.5px" fill="#ffffff">Doku<tspan fill="url(#text-grad)">Reader</tspan></text>
    
    <!-- Tagline -->
    <text x="652" y="228" class="tagline" font-size="20" font-weight="600" letter-spacing="4px" fill="#94a3b8" opacity="0.8">LOCAL DOCUMENT LIBRARY</text>

    <!-- Small decorative underline accent for tagline -->
    <rect x="652" y="244" width="80" height="3" rx="1.5" fill="url(#text-grad)" opacity="0.8"/>
  </g>

</svg>
