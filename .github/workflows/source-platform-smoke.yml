name: Source Platform Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tkinter und Xvfb installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install Pillow "pypdf>=3.0.0,<4.0.0" reportlab

      - name: Plattform-Smoke ausführen (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHONIOENCODING: utf-8
        run: xvfb-run -a python tests/source_platform_smoke.py

      - name: Plattform-Smoke ausführen (macOS)
        if: runner.os == 'macOS'
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/source_platform_smoke.py
