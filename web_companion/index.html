<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1976d2">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DokuReader">
  <title>DokuReader Companion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/dokureader-companion-192.png">
  <link rel="apple-touch-icon" href="icons/dokureader-companion-180.png">
</head>
<body>
  <header>
    <h1 id="app-title" data-i18n="app_title">DokuReader Companion</h1>
    <div class="header-actions">
      <select id="lang-select" aria-label="Sprache auswählen">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
        <option value="ru">Русский</option>
      </select>
      <button id="import-btn" type="button" data-i18n="import_btn">JSON importieren</button>
      <button id="demo-btn" type="button" data-i18n="demo_btn">Demo laden</button>
      <button id="export-btn" type="button" hidden data-i18n="export_btn">Status exportieren</button>
      <button id="clear-btn" type="button" hidden data-i18n="clear_btn">Lokale Daten löschen</button>
      <input type="file" id="file-input" accept=".json" hidden>
    </div>
  </header>

  <button id="drop-zone" type="button" aria-describedby="drop-zone-help">
    <span id="drop-zone-help" data-i18n="drop_zone_help">dokureader-library-v1.json hierher ziehen oder zum Auswählen aktivieren</span>
  </button>

  <div id="status-bar" class="status-bar" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="main-layout">
    <aside id="sidebar">
      <h2 id="topics-heading" data-i18n="topics_heading">Themen</h2>
      <ul id="topic-list" role="list"></ul>
    </aside>

    <section id="content">
      <div class="filter-bar">
        <input id="search" type="search" placeholder="Dokument suchen…" aria-label="Dokument suchen">
        <label class="checkbox-label">
          <input type="checkbox" id="show-missing" checked>
          <span id="show-missing-text" data-i18n="show_missing">Fehlende anzeigen</span>
        </label>
      </div>
      <div id="doc-list" aria-live="polite">
        <p class="empty">Noch keine Bibliothek geladen.</p>
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
